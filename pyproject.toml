[project]
name = "confluence-markdown"
version = "0.1.0"
description = "A tool to download, read, and update Confluence Data Center pages with markdown support"
readme = "README.md"
license = "WTFPL"
requires-python = ">=3.10"
keywords = ["confluence", "markdown", "cli", "atlassian", "wiki"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31.0",
    "markdownify>=0.11.6",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.4.0",
    "inquirerpy>=0.3.4",
    "rich>=14.2.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.0.0",
    "argcomplete>=3.6.3",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
]

[project.urls]
Repository = "https://github.com/jvanvinkenroye/confluence_markdown"
Issues = "https://github.com/jvanvinkenroye/confluence_markdown/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.9.0"]

[project.scripts]
confluence-markdown = "confluence_markdown.main:main"
confluence-markdown-mcp = "confluence_markdown.mcp_server:main"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.13",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
